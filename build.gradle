plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.seleniumhq.selenium:selenium-java:4.26.0'
    implementation 'org.testng:testng:7.11.0'

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'

    implementation 'net.datafaker:datafaker:2.5.2'

    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'com.squareup.okhttp3:okhttp:4.9.2'

}

test {
    useTestNG()
}

tasks.register('smoke', Test) {
    group = 'verification'
    description = 'Runs PhoneBook UI smoke tests (login and registration).'
    useTestNG() {
        suites 'src/test/resources/smoke.xml'
    }
}

tasks.register('apiRegress', Test){
    group = 'regression';
    description = 'Runs PhoneBook API regress tests(login and registration).'
    useTestNG() {
        suites 'src/test/resources/regression.xml'
    }
}
